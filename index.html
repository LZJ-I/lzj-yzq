<!DOCTYPE html>
<html lang="zh-CN" class="is-loading" aria-busy="true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LZJ与YZQ的恋爱计时器</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="./assets/fonts/dancing-script-700.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="./assets/fonts/dancing-script-400.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="./assets/luxon.min.js" as="script">
    <style>
        html { background-color: #f7eef5; }
        html.is-loading body > :not(#page-loader) { opacity: 0; }
        .page-loader {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7eef5 linear-gradient(to bottom right, rgba(88, 28, 135, 0.3), rgba(157, 23, 77, 0.3), rgba(126, 34, 206, 0.3));
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }
        html.is-ready .page-loader {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loader-heart {
            font-size: 2.75rem;
            line-height: 1;
            color: #C71585;
            filter: drop-shadow(0 0 14px rgba(255, 105, 180, 0.55));
            animation: loader-beat 1.15s ease-in-out infinite;
        }
        @keyframes loader-beat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.14); }
            28% { transform: scale(1); }
            42% { transform: scale(1.14); }
        }
        @media (prefers-reduced-motion: reduce) {
            .loader-heart { animation: none; }
            .page-loader { transition: none; }
        }
    </style>
    <link href="./assets/styles.css?v=6" rel="stylesheet">
    <noscript>
        <style>
            html.is-loading body > :not(#page-loader) { opacity: 1 !important; }
            #page-loader { display: none !important; }
        </style>
    </noscript>
</head>
<body class="bg-gradient-to-br from-purple-900/30 via-pink-800/30 to-purple-700/30 min-h-screen flex flex-col items-center justify-center p-4 overflow-hidden">
    <div id="page-loader" class="page-loader" aria-hidden="true">
        <span class="loader-heart">❤</span>
    </div>

    <!-- 装饰性元素 - 爱心和流星 -->

        <!-- 爱心元素 -->
        <div class="absolute top-10 left-10 w-16 h-16 text-love/20 heart-beat"><i class="fa fa-heart text-4xl"></i></div>
        <div class="absolute top-20 right-20 w-12 h-12 text-love/20 heart-beat" style="animation-delay: 0.3s"><i class="fa fa-heart text-3xl"></i></div>

        <!-- 流星容器 -->
        <div id="meteor-container" class="absolute inset-0 w-full h-full pointer-events-none"></div>

        <!-- 页脚 -->

    <script src="./assets/luxon.min.js"></script>
    <script src="./config.js"></script>
    <script>
        const startDate = luxon.DateTime.fromISO(COUPLE_CONFIG.startDate).toJSDate();
        const titleElement = document.getElementById('title');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        document.title = `${COUPLE_CONFIG.name1}与${COUPLE_CONFIG.name2}的恋爱计时器`;
        titleElement.innerHTML =
            `${COUPLE_CONFIG.name1}<span class="text-love heart-beat">❤</span>${COUPLE_CONFIG.name2}`;
        document.getElementById('motto').textContent = COUPLE_CONFIG.motto;

        // 计时模式：0-年月日时分秒(默认)，1-月天时分秒，2-周天时分秒，3-天时分秒，4-时分秒，5-分秒，6-秒
        let timerMode = 0;
        const totalModes = 7;
        const modeNames = [
            "年月日时分秒",
            "月天时分秒",
            "周天时分秒",
            "天时分秒",
            "时分秒",
            "分秒",
            "秒"
        ];

        function setText(id, value, tick) {
            const el = document.getElementById(id);
            const next = String(value);
            if (el.hasAttribute('data-ch')) {
                const digits = Math.max(next.length, Number(el.getAttribute('data-ch')) || 0);
                el.setAttribute('data-ch', String(digits));
                el.style.width = `${digits}ch`;
            }
            if (el.textContent === next) return;
            el.textContent = next;
            if (!tick || reduceMotion) return;
            el.classList.remove('digit-tick');
            void el.offsetWidth;
            el.classList.add('digit-tick');
        }

        function createMeteor() {
            const container = document.getElementById('meteor-container');
            const meteor = document.createElement('div');
            meteor.classList.add('meteor');

            const startX = Math.random() * window.innerWidth;
            const startY = Math.random() * window.innerHeight / 2;
            const duration = 2 + Math.random() * 3;

            meteor.style.top = `${startY}px`;
            meteor.style.left = `${startX}px`;
            meteor.style.animationDuration = `${duration}s`;

            container.appendChild(meteor);
            setTimeout(() => meteor.remove(), duration * 1000);
        }

        function startAtmosphere() {
            if (reduceMotion) return;
            setInterval(createMeteor, 1500);
            for (let i = 0; i < 3; i++) {
                setTimeout(createMeteor, i * 500);
            }
        }

        function calculateDateDifference(start, end) {
            const startDT = luxon.DateTime.fromJSDate(start);
            const endDT = luxon.DateTime.fromJSDate(end);

            if (startDT >= endDT) {
                return {
                    years: 0, months: 0, weeks: 0, days: 0,
                    hours: 0, minutes: 0, seconds: 0,
                    totalDays: 0, totalSeconds: 0,
                    daysRemaining: 0
                };
            }

            const cal = endDT.diff(startDT, ["years", "months", "days", "hours", "minutes", "seconds"]).toObject();
            const totalSeconds = Math.floor(endDT.diff(startDT, "seconds").seconds);
            const totalDays = Math.floor(endDT.diff(startDT, "days").days);

            return {
                years: cal.years,
                months: cal.months,
                days: cal.days,
                hours: cal.hours,
                minutes: cal.minutes,
                seconds: Math.floor(cal.seconds),
                weeks: Math.floor(totalDays / 7),
                daysRemaining: totalDays % 7,
                totalDays,
                totalSeconds
            };
        }

        function applyMode(mode) {
            timerMode = mode;
            document.getElementById('currentModeText').textContent = modeNames[timerMode];
            for (let i = 0; i < totalModes; i++) {
                document.getElementById(`mode${i}`).classList.toggle('hidden', i !== timerMode);
            }
        }

        function updateTimer() {
            const now = new Date();
            const diff = calculateDateDifference(startDate, now);
            const hours = String(diff.hours).padStart(2, '0');
            const minutes = String(diff.minutes).padStart(2, '0');
            const seconds = String(diff.seconds).padStart(2, '0');

            setText('years', diff.years);
            setText('months', diff.months);
            setText('days', diff.days);
            setText('hours', hours);
            setText('minutes', minutes);
            setText('seconds', seconds, timerMode === 0);

            setText('m1-months', diff.months + diff.years * 12);
            setText('m1-days', diff.days);
            setText('m1-hours', hours);
            setText('m1-minutes', minutes);
            setText('m1-seconds', seconds, timerMode === 1);

            setText('weeks', diff.weeks);
            setText('m2-days', diff.daysRemaining);
            setText('m2-hours', hours);
            setText('m2-minutes', minutes);
            setText('m2-seconds', seconds, timerMode === 2);

            setText('m3-days', diff.totalDays);
            setText('m3-hours', hours);
            setText('m3-minutes', minutes);
            setText('m3-seconds', seconds, timerMode === 3);

            const totalHours = diff.totalDays * 24 + diff.hours;
            setText('m4-hours', totalHours);
            setText('m4-minutes', minutes);
            setText('m4-seconds', seconds, timerMode === 4);

            const totalMinutes = totalHours * 60 + diff.minutes;
            setText('m5-minutes', totalMinutes);
            setText('m5-seconds', seconds, timerMode === 5);

            setText('totalSeconds', diff.totalSeconds);
        }

        function revealPage() {
            const root = document.documentElement;
            if (root.classList.contains('is-ready')) return;
            root.classList.remove('is-loading');
            root.classList.add('is-ready');
            root.removeAttribute('aria-busy');

            const loader = document.getElementById('page-loader');
            if (loader) {
                if (reduceMotion) {
                    loader.remove();
                } else {
                    const removeLoader = () => loader.remove();
                    loader.addEventListener('transitionend', removeLoader, { once: true });
                    setTimeout(removeLoader, 600);
                }
            }
            startAtmosphere();
        }

        async function waitForReady() {
            updateTimer();
            applyMode(timerMode);

            const fontReady = document.fonts
                ? Promise.all([
                    document.fonts.load('700 4rem "Dancing Script"'),
                    document.fonts.load('400 1.25rem "Dancing Script"')
                ]).catch(() => {})
                : Promise.resolve();

            await Promise.race([
                fontReady,
                new Promise((resolve) => setTimeout(resolve, 1000))
            ]);

            if (reduceMotion) {
                revealPage();
                return;
            }
            requestAnimationFrame(() => requestAnimationFrame(revealPage));
        }

        titleElement.addEventListener('click', () => {
            applyMode((timerMode + 1) % totalModes);
            updateTimer();
            titleElement.classList.add('scale-90');
            setTimeout(() => titleElement.classList.remove('scale-90'), 150);
        });

        waitForReady();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
